site_name: agent-dev-toolkit
site_url: https://tibursocampos.github.io/agent-dev-toolkit/
repo_url: https://github.com/tibursocampos/agent-dev-toolkit
repo_name: tibursocampos/agent-dev-toolkit
docs_dir: .
site_dir: ../site
copyright: Copyright &copy; 2026 Raphael Campos — MIT License

theme:
  name: material
  custom_dir: overrides
  language: en
  palette:
    scheme: slate
    primary: teal
    accent: teal
  features:
    - search.suggest
    - search.highlight
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - toc.follow
    - content.code.copy

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
          nav_translations:
            Home: Home
            Get started: Get started
            CLI: CLI
            First use: First use
            Orchestrated Delivery: Orchestrated Delivery
            Using skills: Using skills
            Architecture: Architecture
            Adapters: Adapters
            Reference: Reference
            Credits: Credits
            Maintainers: Maintainers
        - locale: pt
          name: Português
          build: true
          nav_translations:
            Home: Início
            Get started: Começar
            CLI: CLI
            First use: Primeiro uso
            Orchestrated Delivery: Entrega orquestrada
            Using skills: Usando skills
            Architecture: Arquitetura
            Adapters: Adaptadores
            Reference: Referência
            Credits: Créditos
            Maintainers: Mantenedores

nav:
  - Home: index.md
  - Get started: get-started.md
  - CLI: cli.md
  - First use: first-use.md
  - Orchestrated Delivery: orchestrated-delivery.md
  - Using skills: using-skills.md
  - Architecture: architecture.md
  - Adapters: adapters.md
  - Reference: reference.md
  - Credits: credits.md
  - Maintainers: maintainers.md

markdown_extensions:
  - attr_list
  - admonition
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/agent-switcher.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tibursocampos/agent-dev-toolkit
  generator: false
