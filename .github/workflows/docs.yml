name: Docs

on:
  push:
    branches: [master, main, develop]
  workflow_dispatch:

# Build on pushes and manual dispatch; pull-request merge acceptance is owned
# by validate-toolkit.yml (see its docs-strict job).
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs-site/requirements-docs.txt

      # Public docs only (MkDocs site) — not docs/documentation-plan.
      - name: Install docs dependencies
        run: pip install -r docs-site/requirements-docs.txt
        working-directory: ${{ github.workspace }}

      - name: Build MkDocs
        run: mkdocs build --strict -f docs-site/mkdocs.yml
        working-directory: ${{ github.workspace }}

      - name: Upload Pages artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
