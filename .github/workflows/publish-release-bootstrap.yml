# Publish Release assets for Option 0 bootstrap (HTTPS zip + SHA256 + entrypoints).
# Fixed names are SoT for scripts/bootstrap and public docs — do not invent alternates.
name: Publish release bootstrap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to upload assets to (e.g. v1.2.3).
        required: true

permissions:
  contents: write

env:
  ZIP_ASSET: agent-dev-toolkit.zip
  CHECKSUM_ASSET: agent-dev-toolkit.zip.sha256

jobs:
  publish:
    if: >-
      ${{ github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Validate publication intent
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          WORKFLOW_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            [[ "${WORKFLOW_REF}" == "refs/heads/master" || "${WORKFLOW_REF}" == "refs/heads/main" ]] || {
              echo "Manual publication is only approved from master or main (got ${WORKFLOW_REF})" >&2
              exit 1
            }
            [[ "${INPUT_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "Manual publication requires a tag matching vMAJOR.MINOR.PATCH" >&2
              exit 1
            }
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify exact release tag checkout
        env:
          CHECKED_OUT_TAG: ${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          tag_commit="$(git rev-list -n 1 "refs/tags/${CHECKED_OUT_TAG}")"
          head_commit="$(git rev-parse HEAD)"
          [[ "${tag_commit}" == "${head_commit}" ]] || {
            echo "Checked out commit does not match requested release tag ${CHECKED_OUT_TAG}" >&2
            exit 1
          }

      - name: Pack toolkit zip + checksum + bootstrap entrypoints
        shell: bash
        run: |
          set -euo pipefail
          STAGE="${RUNNER_TEMP}/adt-stage"
          OUT="${RUNNER_TEMP}/adt-out"
          rm -rf "$STAGE" "$OUT"
          mkdir -p "$STAGE" "$OUT"

          # Zip root = repo content (no nested folder) so extract exposes scripts/toolkit.ps1
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/workflows/publish-release-bootstrap.yml' \
            --exclude 'dist/' \
            --exclude 'node_modules/' \
            --exclude '.inventory/' \
            ./ "$STAGE/"

          (
            cd "$STAGE"
            zip -r -q "${OUT}/${ZIP_ASSET}" .
          )

          (
            cd "$OUT"
            sha256sum "${ZIP_ASSET}" | tee "${CHECKSUM_ASSET}"
          )

          cp scripts/bootstrap/bootstrap.ps1 scripts/bootstrap/bootstrap.bat scripts/bootstrap/bootstrap.sh "$OUT/"
          ls -la "$OUT"

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/adt-out"
          gh release upload "$RELEASE_TAG" \
            "${OUT}/${ZIP_ASSET}" \
            "${OUT}/${CHECKSUM_ASSET}" \
            "${OUT}/bootstrap.ps1" \
            "${OUT}/bootstrap.bat" \
            "${OUT}/bootstrap.sh" \
            --clobber

          echo "Uploaded to release tag: $RELEASE_TAG"
          echo "Assets: ${ZIP_ASSET}, ${CHECKSUM_ASSET}, bootstrap.ps1, bootstrap.bat, bootstrap.sh"
