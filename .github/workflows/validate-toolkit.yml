name: Validate toolkit

# Full suite only on pull requests into develop.
# Release pull requests into master or main run enforce-release-source.yml only.
# That workflow accepts develop alone, and develop already passed this suite.
on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  validate-core:
    name: Validate core
    runs-on: windows-latest
    env:
      VALIDATION_JOB_NAME: validate-core
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run core validation
        shell: pwsh
        run: ./scripts/validation/validate-core.ps1
        working-directory: ${{ github.workspace }}
      # Disposable USERPROFILE probes (not TEMP: the guard only applies under USERPROFILE).
      # Kept out of validate-core so that suite stays fixture-only.
      - name: Run AllowUserHome forward assert
        shell: pwsh
        run: ./scripts/validation/Assert-SyncAllowUserHomeForward.ps1
        working-directory: ${{ github.workspace }}

  adapter-smoke:
    name: Adapter smoke (${{ matrix.adapter }}, ubuntu)
    needs: validate-core
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter:
          - cursor
          - antigravity
          - claude
          - codex
          - copilot
          - opencode
          - grok
          - zcode
          - hermes
          - openhands
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run adapter smoke
        shell: pwsh
        run: ./scripts/validation/Invoke-AdapterCiSmoke.ps1 -Adapter ${{ matrix.adapter }} -Quiet
        working-directory: ${{ github.workspace }}

  adapter-smoke-windows:
    name: Adapter smoke (codex, windows)
    needs: validate-core
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run adapter smoke
        shell: pwsh
        run: ./scripts/validation/Invoke-AdapterCiSmoke.ps1 -Adapter codex -Quiet
        working-directory: ${{ github.workspace }}

  docs-strict:
    name: Docs strict build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs-site/requirements-docs.txt
      - name: Install docs dependencies
        run: pip install -r docs-site/requirements-docs.txt
        working-directory: ${{ github.workspace }}
      - name: Build MkDocs strictly
        run: mkdocs build --strict -f docs-site/mkdocs.yml
        working-directory: ${{ github.workspace }}

  # Canonical ruleset check: every validation job must succeed.
  # Legacy branch protection also requires ci-ok, so it is emitted below as an alias.
  validate:
    name: validate
    if: always()
    needs:
      - validate-core
      - adapter-smoke
      - adapter-smoke-windows
      - docs-strict
    runs-on: ubuntu-latest
    steps:
      - name: All validation jobs green
        env:
          REQUIRED_DEPENDENCY_RESULTS: ${{ toJSON(needs) }}
        shell: pwsh
        run: |
          $dependencyResults = $env:REQUIRED_DEPENDENCY_RESULTS | ConvertFrom-Json
          $failedDependencies = @(
            foreach ($property in $dependencyResults.PSObject.Properties) {
              if ($property.Value.result -ne 'success') {
                '{0}={1}' -f $property.Name, $property.Value.result
              }
            }
          )
          if ($failedDependencies.Count -gt 0) {
            throw "Required validation dependencies did not all succeed: $($failedDependencies -join ', ')"
          }
          Write-Host 'All required validation dependencies succeeded.'

  # Compatibility alias required by legacy branch protection.
  ci-ok:
    if: always()
    needs:
      - validate-core
      - adapter-smoke
      - adapter-smoke-windows
      - docs-strict
      - validate
    runs-on: ubuntu-latest
    steps:
      - name: All validate jobs green
        env:
          REQUIRED_DEPENDENCY_RESULTS: ${{ toJSON(needs) }}
        shell: pwsh
        run: |
          $dependencyResults = $env:REQUIRED_DEPENDENCY_RESULTS | ConvertFrom-Json
          $failedDependencies = @(
            foreach ($property in $dependencyResults.PSObject.Properties) {
              if ($property.Value.result -ne 'success') {
                '{0}={1}' -f $property.Name, $property.Value.result
              }
            }
          )
          if ($failedDependencies.Count -gt 0) {
            throw "Required validation dependencies did not all succeed: $($failedDependencies -join ', ')"
          }
          Write-Host 'All required validation dependencies succeeded.'
