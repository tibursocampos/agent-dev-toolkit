            -ScriptPath $path `
            -Action { & $path -Quiet }
          if ($exitCode -ne 0) { exit $exitCode }
        working-directory: ${{ github.workspace }}
      - name: Complete validation telemetry
        if: always()
        env:
          VALIDATION_JOB_STATUS: ${{ job.status }}
        shell: pwsh
        run: |
          . "$env:GITHUB_WORKSPACE/scripts/_lib/Invoke-ValidationTelemetry.ps1"
          $startedAt = Get-Content -Raw -LiteralPath "$env:RUNNER_TEMP/validation-started-at.txt"
          $finishedAt = [DateTimeOffset]::UtcNow
          $duration = ($finishedAt - [DateTimeOffset]::Parse($startedAt.Trim())).TotalMilliseconds
          Write-ValidationTelemetryJob -Path $env:VALIDATION_RESULTS_PATH -JobName $env:VALIDATION_JOB_NAME -Status $env:VALIDATION_JOB_STATUS -DurationMs $duration -StartedAtUtc $startedAt.Trim() -FinishedAtUtc $finishedAt.ToString('o')
      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-results-${{ github.job }}-${{ matrix.adapter }}
          path: ${{ runner.temp }}/validation-results.jsonl
          if-no-files-found: warn

  validate-ubuntu:
    runs-on: ubuntu-latest
    env:
      VALIDATION_JOB_NAME: validate-ubuntu
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Start validation telemetry
        shell: pwsh
        run: |
