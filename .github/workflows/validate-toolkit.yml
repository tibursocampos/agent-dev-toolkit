          path: ${{ runner.temp }}/validation-results.jsonl
          if-no-files-found: warn

  docs-strict:
    name: Docs strict build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs-site/requirements-docs.txt
      - name: Install docs dependencies
        run: pip install -r docs-site/requirements-docs.txt
        working-directory: ${{ github.workspace }}
      - name: Build MkDocs strictly
        run: mkdocs build --strict -f docs-site/mkdocs.yml
        working-directory: ${{ github.workspace }}

  # Single required gate: every setup/core, docs, and matrix job must succeed.
  # Branch protection should require this check name (ci-ok), not only validate.
  ci-ok:
    if: always()
    needs:
      - validate
      - validate-windows-keyed-uninstall
      - validate-windows-adapter-smoke
      - validate-ubuntu
      - validate-ubuntu-adapter-smoke
      - docs-strict
    runs-on: ubuntu-latest
    env:
      VALIDATION_JOB_NAME: ci-ok
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Start validation telemetry
        shell: pwsh
        run: |
          $validationResultsPath = Join-Path $env:RUNNER_TEMP 'validation-results.jsonl'
          "VALIDATION_RESULTS_PATH=$validationResultsPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $startedAt = [DateTimeOffset]::UtcNow
          $startedAt.ToString('o') | Set-Content -LiteralPath "$env:RUNNER_TEMP/validation-started-at.txt" -Encoding UTF8
      - name: All validate jobs green
        env:
          REQUIRED_DEPENDENCY_RESULTS: ${{ toJSON(needs) }}
        shell: pwsh
        run: |
          $requiredDependencies = @(
            'validate'
            'validate-windows-keyed-uninstall'
            'validate-windows-adapter-smoke'
            'validate-ubuntu'
            'validate-ubuntu-adapter-smoke'
            'docs-strict'
          )
          $dependencyResults = $env:REQUIRED_DEPENDENCY_RESULTS | ConvertFrom-Json
          $failedDependencies = @(
            foreach ($dependency in $requiredDependencies) {
              $result = $dependencyResults.$dependency.result
              if ($result -ne 'success') {
                '{0}={1}' -f $dependency, $result
              }
            }
          )
          if ($failedDependencies.Count -gt 0) {
            throw "Required validation dependencies did not all succeed: $($failedDependencies -join ', ')"
          }
          Write-Host 'All required validation dependencies succeeded.'
      - name: Complete validation telemetry
        if: always()
        env:
          VALIDATION_JOB_STATUS: ${{ job.status }}
        shell: pwsh
        run: |
          . "$env:GITHUB_WORKSPACE/scripts/_lib/Invoke-ValidationTelemetry.ps1"
          $startedAt = Get-Content -Raw -LiteralPath "$env:RUNNER_TEMP/validation-started-at.txt"
          $finishedAt = [DateTimeOffset]::UtcNow
          $duration = ($finishedAt - [DateTimeOffset]::Parse($startedAt.Trim())).TotalMilliseconds
          Write-ValidationTelemetryJob -Path $env:VALIDATION_RESULTS_PATH -JobName $env:VALIDATION_JOB_NAME -Status $env:VALIDATION_JOB_STATUS -DurationMs $duration -StartedAtUtc $startedAt.Trim() -FinishedAtUtc $finishedAt.ToString('o')
      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-results-${{ github.job }}
          path: ${{ runner.temp }}/validation-results.jsonl
          if-no-files-found: warn
