          - { adapter: Grok, script: Invoke-GrokCiSmoke.ps1 }
          - { adapter: ZCode, script: Invoke-ZCodeCiSmoke.ps1 }
          - { adapter: Hermes, script: Invoke-HermesCiSmoke.ps1 }
