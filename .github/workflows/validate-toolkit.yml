name: Validate toolkit

on:
  pull_request:
    branches: [master, main, develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    env:
      VALIDATION_JOB_NAME: validate-windows
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Start validation telemetry
        shell: pwsh
        run: |
          $validationResultsPath = Join-Path $env:RUNNER_TEMP 'validation-results.jsonl'
          "VALIDATION_RESULTS_PATH=$validationResultsPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          . "$env:GITHUB_WORKSPACE/scripts/_lib/Invoke-ValidationTelemetry.ps1"
          $startedAt = [DateTimeOffset]::UtcNow
          $startedAt.ToString('o') | Set-Content -LiteralPath "$env:RUNNER_TEMP/validation-started-at.txt" -Encoding UTF8
      # In-repo core suite only — no sync to USERPROFILE / agent home.
      # Keyed uninstall asserts run separately and use validate-agent -SkipCore.
      - name: Run validate-core
        shell: pwsh
        run: |
          . "$env:GITHUB_WORKSPACE/scripts/_lib/Invoke-ValidationTelemetry.ps1"
          $exitCode = Invoke-ValidationCheckWithTelemetry `
            -Path $env:VALIDATION_RESULTS_PATH `
            -JobName $env:VALIDATION_JOB_NAME `
            -CheckName 'validate-core' `
            -ScriptPath './scripts/validation/validate-core.ps1' `
            -Action { & ./scripts/validation/validate-core.ps1 -Quiet }
          if ($exitCode -ne 0) { exit $exitCode }
        working-directory: ${{ github.workspace }}
      # Disposable USERPROFILE probes (not TEMP — guard only applies under USERPROFILE).
      # Cleanup is handled by the assertion's try/finally and registered-probe sweep.
      - name: Run AllowUserHome forward assert
        shell: pwsh
        run: |
          . "$env:GITHUB_WORKSPACE/scripts/_lib/Invoke-ValidationTelemetry.ps1"
          $exitCode = Invoke-ValidationCheckWithTelemetry `
            -Path $env:VALIDATION_RESULTS_PATH `
            -JobName $env:VALIDATION_JOB_NAME `
            -CheckName 'allow-user-home-forward' `
            -ScriptPath './scripts/validation/Assert-SyncAllowUserHomeForward.ps1' `
            -Action { & ./scripts/validation/Assert-SyncAllowUserHomeForward.ps1 }
          if ($exitCode -ne 0) { exit $exitCode }
        working-directory: ${{ github.workspace }}
      - name: Complete validation telemetry
        if: always()
        env:
          VALIDATION_JOB_STATUS: ${{ job.status }}
        shell: pwsh
        run: |
          . "$env:GITHUB_WORKSPACE/scripts/_lib/Invoke-ValidationTelemetry.ps1"
          $startedAt = Get-Content -Raw -LiteralPath "$env:RUNNER_TEMP/validation-started-at.txt"
          $finishedAt = [DateTimeOffset]::UtcNow
          $duration = ($finishedAt - [DateTimeOffset]::Parse($startedAt.Trim())).TotalMilliseconds
          Write-ValidationTelemetryJob -Path $env:VALIDATION_RESULTS_PATH -JobName $env:VALIDATION_JOB_NAME -Status $env:VALIDATION_JOB_STATUS -DurationMs $duration -StartedAtUtc $startedAt.Trim() -FinishedAtUtc $finishedAt.ToString('o')
      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-results-${{ github.job }}
          path: ${{ runner.temp }}/validation-results.jsonl
          if-no-files-found: warn

  validate-windows-keyed-uninstall:
    name: Windows keyed uninstall (${{ matrix.adapter }})
    needs: validate
    runs-on: windows-latest
    env:
      VALIDATION_JOB_NAME: validate-windows-keyed-uninstall-${{ matrix.adapter }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { adapter: Claude, script: Assert-ClaudeKeyedUninstall.ps1 }
          - { adapter: Copilot, script: Assert-CopilotKeyedUninstall.ps1 }
          - { adapter: Codex, script: Assert-CodexKeyedUninstall.ps1 }
          - { adapter: OpenCode, script: Assert-OpenCodeKeyedUninstall.ps1 }
          - { adapter: Antigravity, script: Assert-AntigravityKeyedUninstall.ps1 }
          - { adapter: Grok, script: Assert-GrokKeyedUninstall.ps1 }
          - { adapter: Cursor, script: Assert-CursorKeyedUninstall.ps1 }
          - { adapter: ZCode, script: Assert-ZcodeKeyedUninstall.ps1 }
          - { adapter: Hermes, script: Assert-HermesKeyedUninstall.ps1 }
          - { adapter: OpenHands, script: Assert-OpenHandsKeyedUninstall.ps1 }
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Start validation telemetry
        shell: pwsh
        run: |
          $validationResultsPath = Join-Path $env:RUNNER_TEMP 'validation-results.jsonl'
          "VALIDATION_RESULTS_PATH=$validationResultsPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $startedAt = [DateTimeOffset]::UtcNow
          $startedAt.ToString('o') | Set-Content -LiteralPath "$env:RUNNER_TEMP/validation-started-at.txt" -Encoding UTF8
      - name: Run keyed uninstall assert
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . "$env:GITHUB_WORKSPACE/scripts/_lib/Invoke-ValidationTelemetry.ps1"
          $path = Join-Path $env:GITHUB_WORKSPACE 'scripts/validation/${{ matrix.script }}'
          Write-Host "Running: $path"
          $exitCode = Invoke-ValidationCheckWithTelemetry `
            -Path $env:VALIDATION_RESULTS_PATH `
            -JobName $env:VALIDATION_JOB_NAME `
            -CheckName '${{ matrix.adapter }}' `
            -ScriptPath $path `
            -Action { & $path }
          if ($exitCode -ne 0) { exit $exitCode }
        working-directory: ${{ github.workspace }}
      - name: Complete validation telemetry
        if: always()
        env:
          VALIDATION_JOB_STATUS: ${{ job.status }}
        shell: pwsh
        run: |
          . "$env:GITHUB_WORKSPACE/scripts/_lib/Invoke-ValidationTelemetry.ps1"
          $startedAt = Get-Content -Raw -LiteralPath "$env:RUNNER_TEMP/validation-started-at.txt"
          $finishedAt = [DateTimeOffset]::UtcNow
          $duration = ($finishedAt - [DateTimeOffset]::Parse($startedAt.Trim())).TotalMilliseconds
          Write-ValidationTelemetryJob -Path $env:VALIDATION_RESULTS_PATH -JobName $env:VALIDATION_JOB_NAME -Status $env:VALIDATION_JOB_STATUS -DurationMs $duration -StartedAtUtc $startedAt.Trim() -FinishedAtUtc $finishedAt.ToString('o')
      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-results-${{ github.job }}-${{ matrix.adapter }}
          path: ${{ runner.temp }}/validation-results.jsonl
          if-no-files-found: warn

